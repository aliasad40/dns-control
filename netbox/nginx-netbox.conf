# dns-control: HTTPS reverse proxy for NetBox (docker, bound to 127.0.0.1:8000).
# Access is limited by ufw (443/tcp only from the NOC IPs).
# When a domain is added: change server_name, swap the cert, update ALLOWED_HOSTS/CSRF_TRUSTED_ORIGINS.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name 103.125.176.10;

    ssl_certificate     /etc/nginx/ssl/netbox.crt;
    ssl_certificate_key /etc/nginx/ssl/netbox.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    server_tokens off;
    client_max_body_size 25m;

    access_log /var/log/nginx/netbox.access.log;
    error_log  /var/log/nginx/netbox.error.log;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 120s;
    }
}
