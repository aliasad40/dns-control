[defaults]
inventory = inventory/hosts.yml
remote_user = dnsadmin
private_key_file = ~/.ssh/dnsadmin_ed25519
forks = 25
# Keep host key checking ON: it is what stops a MITM from receiving our sudo session.
host_key_checking = True
callback_result_format = yaml
retry_files_enabled = False

[ssh_connection]
pipelining = True
